<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Group Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popup-container">
        <header class="popup-header">
            <h1 class="popup-title">Tab Group Manager</h1>
            <button id="navigatorToggle" class="navigator-toggle-btn">
                네비게이터 켜기
            </button>
        </header>

        <section class="preset-section">
            <h2 class="section-title">프리셋</h2>
            <div id="presetList" class="preset-list">
                <!-- 프리셋 목록이 동적으로 생성됩니다 -->
            </div>
            <button id="savePresetBtn" class="save-preset-btn">
                현재 상태 저장
            </button>
        </section>

        <footer class="popup-footer">
            <a id="settingsLink" class="settings-link" href="#">
                설정
            </a>
        </footer>
    </main>

    <!-- 프리셋 저장 모달 -->
    <div id="saveModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">프리셋 저장</h3>
            <div class="input-group">
                <label for="presetNameInput" class="input-label">프리셋 이름</label>
                <input type="text" id="presetNameInput" class="preset-name-input" placeholder="프리셋 이름을 입력하세요"
                    maxlength="50">
            </div>
            <div class="modal-actions">
                <button id="confirmSaveBtn" class="confirm-btn">저장</button>
                <button id="cancelSaveBtn" class="cancel-btn">취소</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
