<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Group Manager - 설정</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div class="options-container">
        <header class="options-header">
            <h1>Tab Group Manager 설정</h1>
            <p class="subtitle">탭 그룹화 동작을 사용자 정의하세요</p>
        </header>

        <main class="options-main">
            <!-- 자동 그룹화 설정 -->
            <section class="settings-section">
                <h2>자동 그룹화</h2>
                <div class="setting-item">
                    <label class="toggle-label">
                        <input type="checkbox" id="auto-grouping-toggle" class="toggle-input">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">새로운 탭을 자동으로 그룹화</span>
                    </label>
                    <p class="setting-description">
                        활성화하면 새로 열리는 탭이 도메인별로 자동으로 그룹화됩니다.
                    </p>
                </div>
            </section>

            <!-- 세션 복원 설정 -->
            <section class="settings-section">
                <h2>세션 복원</h2>
                <div class="setting-item">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="restore-mode" value="full" id="restore-mode-full">
                            <span class="radio-text">전체 복원</span>
                        </label>
                        <p class="radio-description">
                            브라우저 종료 시점의 모든 탭과 그룹을 복원합니다.
                        </p>

                        <label class="radio-label">
                            <input type="radio" name="restore-mode" value="initial" id="restore-mode-initial">
                            <span class="radio-text">초기 설정만 복원</span>
                        </label>
                        <p class="radio-description">
                            초기에 설정한 그룹과 탭들만 복원합니다.
                        </p>
                    </div>
                </div>
            </section>

            <!-- 제외 도메인 설정 -->
            <section class="settings-section">
                <h2>제외 도메인</h2>
                <div class="setting-item">
                    <p class="setting-description">
                        아래 도메인들은 자동 그룹화에서 제외됩니다.
                    </p>

                    <div class="excluded-domains-container">
                        <div class="add-domain-form">
                            <input type="text" id="new-domain-input" placeholder="예: localhost, example.com"
                                class="domain-input">
                            <button id="add-domain-btn" class="btn btn-primary">추가</button>
                        </div>

                        <div id="excluded-domains-list" class="excluded-domains-list">
                            <!-- 동적으로 생성됨 -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- 파일 URL 권한 설정 -->
            <section class="settings-section">
                <h2>로컬 파일 접근</h2>
                <div class="setting-item">
                    <div class="permission-status">
                        <div class="status-indicator">
                            <span id="permission-status-icon" class="status-icon">❌</span>
                            <span id="permission-status-text" class="status-text">권한 없음</span>
                        </div>
                        <button id="request-permission-btn" class="btn btn-secondary">권한 요청</button>
                    </div>
                    <p class="setting-description">
                        로컬 파일을 디렉토리별로 그룹화하려면 파일 URL 접근 권한이 필요합니다.
                    </p>
                </div>
            </section>
        </main>

        <footer class="options-footer">
            <div class="footer-info">
                <p>Tab Group Manager v1.0.0</p>
                <p>설정 변경사항은 자동으로 저장됩니다.</p>
            </div>
        </footer>
    </div>

    <script src="options.js"></script>
</body>

</html>
